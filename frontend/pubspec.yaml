name: ev_route_planner
description: "EV Charging Route Planner - Smart routes, happy rides, greener tomorrow."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Uncomment and add asset paths if you later replace the
  # illustration widgets with real Figma-exported SVG/PNG assets.
  # assets:
  #   - assets/images/
